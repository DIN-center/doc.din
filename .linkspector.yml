dirs:
  - ./docs
excludedDirs:
  - ./build
  - ./.vercel
  - ./.docusaurus
  - ./node_modules
useGitIgnore: true

ignorePatterns:
  - pattern: "^/img/"
  - pattern: "^/static/"
  - pattern: "^/llms\\.txt$"
  - pattern: "^/llms-full\\.txt$"
  - pattern: "^http(s)?://localhost"
  - pattern: "^http(s)?://127.0.0.1"
  - pattern: "^http(s)?://docs\\.eigencloud\\.xyz"
  - pattern: "how-to/"
  - pattern: "api/index\\.md"

aliveStatusCodes:
  - 200
  - 201
  - 204
  - 206

