---
name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Build once and share artifact with deployment jobs
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create Vercel output structure
        run: |
          mkdir -p .vercel/output
          cp -r build .vercel/output/static
          echo '{"version": 3}' > .vercel/output/config.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .vercel/output/
          retention-days: 1

  lint:
    name: Lint Code Base, Spelling
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Lint code
        uses: ConsenSys/github-actions/docs-lint-all@main

      - name: Lint markdown
        uses: ConsenSys/github-actions/docs-lint-markdown@main

  link-check:
    name: Link Checking
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file-extensions: [".md", ".mdx"]
    steps:
      - uses: actions/checkout@v4

      - name: LinkCheck
        uses: ConsenSys/github-actions/docs-link-check@main
        with:
          FILE_EXTENSION: ${{ matrix.file-extensions }}
          CONFIG_FILE: .linkspector.yml

  case-check:
    name: Check for case being inconsistent
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: ["docs"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Case check action
        uses: ConsenSys/github-actions/docs-case-check@main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOC_DIR: ${{ matrix.folder }}
          SKIP_TEST: true

  # Preview deployment for PRs - reuses build artifact
  preview-deploy:
    name: Deploy Preview to Vercel
    if: github.event_name == 'pull_request'
    needs: [build, lint, link-check, case-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .vercel/output/

      - name: Deploy to Vercel (Preview)
        uses: amondnet/vercel-action@v25
        id: vercel-preview
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prebuilt'
          github-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post/Update PR Comment with Preview URL
        uses: actions/github-script@v7
        if: always()
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deploymentUrl = '${{ steps.vercel-preview.outputs.preview-url }}';
            const deploymentId = '${{ steps.vercel-preview.outputs.deployment-id }}';
            const commitSha = '${{ github.event.pull_request.head.sha }}';
            const shortSha = commitSha.substring(0, 7);
            const commitMessage = `${{ github.event.pull_request.head.commit.message || '' }}`;

            // Create comment body
            const commentBody = `## 🚀 Vercel Preview Deployment

            ${deploymentUrl ? `✅ **Preview**: ${deploymentUrl}` : '⏳ Deployment in progress...'}
            📝 **Commit**: \`${shortSha}\` - ${commitMessage || 'No commit message'}
            🔍 **Inspect**: https://vercel.com/${process.env.VERCEL_ORG_ID}/${process.env.VERCEL_PROJECT_ID}/${deploymentId || 'deployments'}

            ---
            *This preview deployment will be available until the PR is closed.*
            *Last updated: ${new Date().toUTCString()}*`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🚀 Vercel Preview Deployment')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

  # Production deployment - reuses build artifact
  production-deploy:
    name: Deploy Production to Vercel
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, lint, link-check, case-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need to fetch the previous commit to find PR number

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .vercel/output/

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        id: vercel-production
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod --prebuilt'

      - name: Find and Comment on Merged PR
        uses: actions/github-script@v7
        if: always()
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Get the commit SHA that triggered this push
            const commitSha = context.sha;

            // Find PRs associated with this commit
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commitSha
            });

            // Filter for recently merged PRs
            const mergedPRs = prs.filter(pr => pr.merged_at && pr.merge_commit_sha === commitSha);

            if (mergedPRs.length > 0) {
              const pr = mergedPRs[0]; // Take the most recent one
              const productionUrl = '${{ steps.vercel-production.outputs.preview-url }}' || 'https://doc.din.io';
              const shortCommitSha = commitSha.substring(0, 7);

              const commentBody = `## ✅ Production Deployment Complete

              🎉 **This PR has been deployed to production!**
              🌐 **Production URL**: ${productionUrl}
              📝 **Merged Commit**: \`${shortCommitSha}\`
              ⏰ **Deployed at**: ${new Date().toUTCString()}

              ---
              *Thank you for your contribution!*`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: commentBody
              });
            }

  # Semantic release - runs after production deploy
  release:
    name: Create Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: production-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Release
        uses: Consensys/github-actions/docs-release@main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMANTIC_RELEASE: true
